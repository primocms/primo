name: Browser compatibility regressions
on:
  pull_request:
    paths:
      - '.github/workflows/browser-compatibility.yml'
      - 'src/**'
      - 'internal/**'
      - 'tests/**'
      - 'playwright.config.ts'
      - 'package*.json'
permissions:
  contents: read
concurrency:
  group: browser-compatibility-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      PRIMO_TEST_BROWSER: ${{ matrix.browser }}
      PRIMO_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
      PLAYWRIGHT_JSON_OUTPUT_FILE: browser-results.json
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.17.0
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.10
          cache: true
      - run: npm ci
      - run: npm run check
      - run: npm run test:e2e:build
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Verify the fixed WebKit networking library and actual process mapping
        if: matrix.browser == 'webkit'
        run: node tests/platform/webkit-runtime.mjs
      - name: Resolve reserved alias only inside this disposable runner
        run: echo '127.0.0.1 primo-preview.test' | sudo tee -a /etc/hosts
      - name: Narrow invitation layout regression
        run: PLAYWRIGHT_JSON_OUTPUT_FILE=invitation-layout.json npx playwright test tests/e2e/ui-polish.spec.ts --grep 'new passwords' --timeout=90000 --reporter=list,json
      - run: npx playwright test --timeout=90000 --reporter=list,json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-${{ matrix.browser }}
          path: |
            browser-results.json
            webkit-runtime.json
            invitation-layout.json
            test-results
            /tmp/primo-e2e-server.log
