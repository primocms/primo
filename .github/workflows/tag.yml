name: Build and push Docker image

# Published prereleases receive only their exact version image. Stable releases
# additionally update minor, major and latest channels followed by consumers.
# Tag pushes alone build a draft binary release in release.yml.
on:
  release:
    types: [published]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-image:
    # Mirror the old `tags: v3.*` scoping — release events can't filter by tag
    # pattern in `on:`, so guard here instead.
    if: startsWith(github.event.release.tag_name, 'v3.')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    outputs:
      version: ${{ steps.channel.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22.17.0

      - name: Validate release identity and select publication channels
        id: channel
        run: node release/ship/release-channel.mjs

      - name: Retrieve and verify the published qualified RC executables
        if: github.event.release.prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir .release-image --pattern 'primo_linux_amd64' --pattern 'primo_linux_arm64' --pattern 'primo_linux_amd64.qualification.json' --pattern 'primo_linux_arm64.qualification.json'
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          import {verifyCandidateAsset} from './release/ship/candidate-asset.mjs';
          for (const target of ['linux_amd64', 'linux_arm64']) {
            const file = `.release-image/primo_${target}`;
            const report = JSON.parse(await fs.readFile(`${file}.qualification.json`, 'utf8'));
            const sha256 = verifyCandidateAsset({target, report, bytes: await fs.readFile(file), source: process.env.GITHUB_SHA, version: process.env.RELEASE_TAG});
            console.log(`${sha256}  primo_${target}`);
          }
          NODE

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ github.event.release.prerelease && 'release/ship/Dockerfile.native' || 'Dockerfile' }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.channel.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.channel.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            PRIMO_VERSION=${{ github.event.release.tag_name }}

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  # NOTE: the former `deploy-production` job was removed. It SSHed to
  # PRODUCTION_DOCKER_HOST (palacms.com, the retired Hostinger box) and ran
  # `docker compose up`, but that host is decommissioned — it now just 301s to
  # primo.build — so the job failed on every v3.* tag. Infra moved to Railway,
  # which pulls the image published above on its own trigger. Re-add a deploy
  # job here only if a new SSH-deployable host is introduced.
