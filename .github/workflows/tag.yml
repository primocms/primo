name: Build and push Docker image

# Published prereleases receive only their exact version image. Stable releases
# additionally update minor, major and latest channels followed by consumers.
# Tag pushes alone build a draft binary release in release.yml.
on:
  release:
    types: [published]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-image:
    # Mirror the old `tags: v3.*` scoping — release events can't filter by tag
    # pattern in `on:`, so guard here instead.
    if: startsWith(github.event.release.tag_name, 'v3.')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    outputs:
      version: ${{ steps.channel.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22.17.0

      - name: Validate release identity and select publication channels
        id: channel
        run: node release/ship/release-channel.mjs

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.channel.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.channel.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            PRIMO_VERSION=${{ github.event.release.tag_name }}

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  # NOTE: the former `deploy-production` job was removed. It SSHed to
  # PRODUCTION_DOCKER_HOST (palacms.com, the retired Hostinger box) and ran
  # `docker compose up`, but that host is decommissioned — it now just 301s to
  # primo.build — so the job failed on every v3.* tag. Infra moved to Railway,
  # which pulls the image published above on its own trigger. Re-add a deploy
  # job here only if a new SSH-deployable host is introduced.
