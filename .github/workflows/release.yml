name: Build and Release Binaries

on:
  push:
    tags:
      - v*

permissions:
  contents: write
  actions: read

jobs:
  build:
    if: ${{ !contains(github.ref_name, '-') }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
          - os: ubuntu-latest
            goos: linux
            goarch: arm64
          - os: macos-latest
            goos: darwin
            goarch: amd64
          - os: macos-latest
            goos: darwin
            goarch: arm64
          - os: windows-latest
            goos: windows
            goarch: amd64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build frontend
        run: |
          npm ci
          npx svelte-kit sync
          npx vite --config common.config.js build
          npx vite --config app.config.js build
        shell: bash

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          PRIMO_VERSION: ${{ github.ref_name }}
        run: |
          ext=""
          if [ "${{ matrix.goos }}" = "windows" ]; then
            ext=".exe"
          fi
          go build \
            -ldflags="-s -w \
              -X 'github.com/primocms/primo/internal.buildTime=$(date -u +%Y-%m-%dT%H:%M:%SZ)' \
              -X 'github.com/primocms/primo/internal.buildVersion=${PRIMO_VERSION}'" \
            -o primo_${{ matrix.goos }}_${{ matrix.goarch }}${ext} .
        shell: bash

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: primo_${{ matrix.goos }}_${{ matrix.goarch }}
          path: primo_*

  candidate:
    if: contains(github.ref_name, '-')
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [linux_amd64, linux_arm64, darwin_amd64, darwin_arm64, windows_amd64.exe]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.17.0
      - name: Require passing qualification for the exact tagged source
        id: qualified
        uses: actions/github-script@v7
        with:
          script: |
            let native;
            for (const workflow_id of ['rc-platform.yml', 'e2e.yml', 'browser-compatibility.yml', 'staging-preparation.yml']) {
              const response = await github.rest.actions.listWorkflowRuns({ ...context.repo, workflow_id, head_sha: context.sha, event: 'pull_request', per_page: 10 });
              const run = response.data.workflow_runs[0];
              if (!run || run.head_sha !== context.sha || run.conclusion !== 'success') throw new Error(`${workflow_id}: exact source has no current passing qualification`);
              if (workflow_id === 'rc-platform.yml') native = run.id;
            }
            core.setOutput('run', native);
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.qualified.outputs.run }}
          name: rc13-${{ matrix.target }}
          path: qualified
      - name: Retain qualified bytes without rebuilding
        env:
          PRIMO_QUALIFICATION_RUN: ${{ steps.qualified.outputs.run }}
        run: node release/ship/candidate-asset.mjs qualified '${{ matrix.target }}' candidate
      - uses: actions/upload-artifact@v4
        with:
          name: primo_${{ matrix.target }}
          path: candidate/*
          if-no-files-found: error

  release:
    needs: [build, candidate]
    if: ${{ always() && (needs.build.result == 'success' || needs.candidate.result == 'success') }}
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: binaries
          merge-multiple: true

      - name: Upload assets to release
        uses: softprops/action-gh-release@v3
        with:
          files: binaries/*
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ contains(github.ref_name, '-') && 'false' || 'true' }}
