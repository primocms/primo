name: Build and Release Binaries

on:
  push:
    tags:
      - v*

permissions:
  contents: write
  actions: read

jobs:
  candidate:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [linux_amd64, linux_arm64, darwin_amd64, darwin_arm64, windows_amd64.exe]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.17.0
      - name: Require passing qualification for the exact tagged source
        id: qualified
        uses: actions/github-script@v7
        with:
          script: |
            let native;
            for (const workflow_id of ['rc-platform.yml', 'e2e.yml', 'browser-compatibility.yml', 'staging-preparation.yml']) {
              const response = await github.rest.actions.listWorkflowRuns({ ...context.repo, workflow_id, head_sha: context.sha, per_page: 100 });
              const run = response.data.workflow_runs.find(run => ['pull_request', 'workflow_dispatch'].includes(run.event));
              if (!run || run.head_sha !== context.sha || run.conclusion !== 'success') throw new Error(`${workflow_id}: exact source has no current passing qualification`);
              if (workflow_id === 'rc-platform.yml') native = run.id;
            }
            core.setOutput('run', native);
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.qualified.outputs.run }}
          name: rc13-${{ matrix.target }}
          path: qualified
      - name: Retain qualified bytes without rebuilding
        env:
          PRIMO_QUALIFICATION_RUN: ${{ steps.qualified.outputs.run }}
        run: node release/ship/candidate-asset.mjs qualified '${{ matrix.target }}' candidate
      - uses: actions/upload-artifact@v4
        with:
          name: primo_${{ matrix.target }}
          path: candidate/*
          if-no-files-found: error

  release:
    needs: candidate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.17.0
      - name: Require the coordinated public npm packages
        if: ${{ !contains(github.ref_name, '-') }}
        run: node release/ship/verify-release-packages.mjs
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: binaries
          merge-multiple: true

      - name: Record checksums for the retained executables
        working-directory: binaries
        run: sha256sum primo_linux_amd64 primo_linux_arm64 primo_darwin_amd64 primo_darwin_arm64 primo_windows_amd64.exe > SHA256SUMS

      - name: Upload assets to release
        uses: softprops/action-gh-release@v3
        with:
          files: binaries/*
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ contains(github.ref_name, '-') && 'false' || 'true' }}
