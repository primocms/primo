name: Frozen RC.11 timing qualification
on:
  pull_request:
    paths:
      - '.github/workflows/rc11-timing.yml'
      - 'tests/timing/**'
      - 'tests/presence/**'
      - 'tests/e2e/analytics.spec.ts'
      - 'tests/e2e/helpers/editor.ts'
      - 'tests/integration/auth-window.test.mjs'
permissions:
  contents: read
  actions: read
concurrency:
  group: rc11-timing-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux_amd64
          - runner: ubuntu-24.04-arm
            target: linux_arm64
          - runner: macos-15-intel
            target: darwin_amd64
          - runner: macos-15
            target: darwin_arm64
          - runner: windows-latest
            target: windows_amd64.exe
    runs-on: ${{ matrix.runner }}
    env:
      PRIMO_CANDIDATE_SHA: 5642f312bd29b83dea7ed3c86c68581ad52c5db3
      PRIMO_QA_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
      PRIMO_TEST_CMS_BINARY: ${{ github.workspace }}/frozen/primo_${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: rc11-${{ matrix.target }}
          path: frozen
          run-id: 39188774819
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify the original sealed packages and installed archives
        shell: bash
        run: |
          chmod 755 "$PRIMO_TEST_CMS_BINARY"
          node tests/staging/rc8/verify.mjs
      - name: Verify only the qualification harness changed
        if: matrix.target == 'linux_amd64'
        run: |
          git fetch --no-tags --depth=1 origin "$PRIMO_CANDIDATE_SHA"
          node tests/timing/verify-product-tree.mjs
      - name: Recheck exact native production and managed startup contracts
        shell: bash
        run: node --test tests/platform/*.test.mjs
      - name: Reverify original bytes
        run: node tests/staging/rc8/verify.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: timing-native-${{ matrix.target }}
          path: |
            platform-result.json
            production-result.json
            hosted-native-result.json

  exact-browser:
    needs: native
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      PRIMO_CANDIDATE_SHA: 5642f312bd29b83dea7ed3c86c68581ad52c5db3
      PRIMO_QA_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
      PRIMO_TEST_BROWSER: ${{ matrix.browser }}
      PRIMO_BROWSER: ${{ matrix.browser }}
      PRIMO_AUTH_REPEATS: 5
      PRIMO_PRESENCE_HOST: primo-presence.test
      PRIMO_TEST_CMS_BINARY: ${{ github.workspace }}/frozen/primo_linux_amd64
      RC_INSTALL: ${{ github.workspace }}
      PLAYWRIGHT_JSON_OUTPUT_FILE: frozen-results.json
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: rc11-linux_amd64
          path: frozen
          run-id: 39188774819
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify exact installed archives and tested native provenance
        run: |
          chmod 755 "$PRIMO_TEST_CMS_BINARY"
          node tests/staging/rc8/verify.mjs
          node -e 'console.log("PRIMO_TEST_CMS_SHA256="+require("./frozen/platform-result.json").sha256)' >> "$GITHUB_ENV"
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Verify the fixed WebKit networking library and actual process mapping
        if: matrix.browser == 'webkit'
        run: node tests/platform/webkit-runtime.mjs
      - name: Resolve reserved preview alias only inside this disposable runner
        run: echo '127.0.0.1 primo-preview.test primo-presence.test' | sudo tee -a /etc/hosts
      - name: Run the complete suite against the exact native package
        run: npx playwright test --timeout=90000 --reporter=list,json
      - name: Repeat controlled cold-download analytics recovery
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: timing-repeats.json
        run: npx playwright test tests/e2e/analytics.spec.ts --grep 'timed-out compiler' --repeat-each=3 --timeout=90000 --reporter=list,json
      - name: Repeat Firefox worker recovery and the original scrolling scenario
        if: matrix.browser == 'firefox'
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: firefox-compiler-repeats.json
        run: npx playwright test tests/e2e/compiler-lifecycle.spec.ts tests/e2e/page-creation.spec.ts --grep 'Firefox engine regexp|replaces one visible loading row' --repeat-each=10 --timeout=90000 --reporter=list,json
      - name: Run the actual packaged agent and client handoff
        if: ${{ !cancelled() }}
        run: node --test tests/staging/rc8/handoff.test.mjs
      - name: Verify fresh production password sign-in and scoped dashboard
        if: ${{ !cancelled() }}
        run: node --test tests/presence/auth.test.mjs
      - name: Verify production presence cancellation, reload and content retention
        if: ${{ !cancelled() }}
        run: node --test tests/presence/browser.test.mjs
      - name: Verify canceled scoped-user and site-list caches recover without reload
        if: ${{ !cancelled() }}
        run: node --test tests/presence/cache.test.mjs
      - name: Reverify all product bytes
        if: always()
        run: node tests/staging/rc8/verify.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: timing-exact-${{ matrix.browser }}
          path: |
            frozen-results.json
            timing-repeats.json
            auth-*-trace.zip
            firefox-compiler-repeats.json
            webkit-runtime.json
            test-results
            /tmp/primo-e2e-server.log
            presence-${{ matrix.browser }}.json
            cache-${{ matrix.browser }}.json
            auth-${{ matrix.browser }}.json

  native-safari:
    needs: native
    runs-on: macos-15
    timeout-minutes: 15
    env:
      PRIMO_CANDIDATE_SHA: 5642f312bd29b83dea7ed3c86c68581ad52c5db3
      PRIMO_QA_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
      PRIMO_TEST_CMS_BINARY: ${{ github.workspace }}/frozen/primo_darwin_arm64
      PRIMO_QA_SAFARI_WEBDRIVER: http://127.0.0.1:4444
      PRIMO_PRESENCE_HOST: primo-presence.test
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: rc11-darwin_arm64
          path: frozen
          run-id: 39188774819
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify the exact Mac candidate and unchanged built CLI/MCP packages
        run: |
          chmod 755 "$PRIMO_TEST_CMS_BINARY"
          node tests/staging/rc8/verify.mjs
      - name: Run actual Safari with local generated accounts only
        shell: bash
        run: |
          sudo /usr/bin/safaridriver --enable
          echo '127.0.0.1 primo-presence.test' | sudo tee -a /etc/hosts
          /usr/bin/safaridriver --port 4444 > "$RUNNER_TEMP/safari-driver.log" 2>&1 &
          driver_pid=$!
          trap 'kill "$driver_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4444/status > /dev/null; then break; fi
            sleep 1
          done
          node --test tests/presence/safari.test.mjs
      - name: Reverify all product bytes
        if: always()
        run: node tests/staging/rc8/verify.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: timing-native-safari
          path: presence-safari.json
          if-no-files-found: error

  copied-recovery:
    needs: native
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PRIMO_CANDIDATE_SHA: 5642f312bd29b83dea7ed3c86c68581ad52c5db3
      PRIMO_QA_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
      PRIMO_TEST_CMS_BINARY: ${{ github.workspace }}/frozen/primo_linux_amd64
      PRIMO_PREVIOUS_BINARY: ${{ github.workspace }}/previous/primo_linux_amd64
      PRIMO_RECOVERY_RESULT: ${{ github.workspace }}/recovery-result.json
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: rc11-linux_amd64
          path: frozen
          run-id: 39188774819
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          name: rc7-linux_amd64
          path: previous
          run-id: 38962963117
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify candidate provenance and rehearse production copied recovery
        run: |
          chmod 755 "$PRIMO_TEST_CMS_BINARY" "$PRIMO_PREVIOUS_BINARY"
          node tests/staging/rc8/verify.mjs
          node --test tests/staging/rc8/recovery.test.mjs
          node tests/staging/rc8/verify.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: timing-copied-recovery
          path: recovery-result.json
          if-no-files-found: warn

  adversarial-framing:
    needs: native
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PRIMO_CANDIDATE_SHA: 5642f312bd29b83dea7ed3c86c68581ad52c5db3
      PRIMO_QA_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
      PRIMO_TEST_CMS_BINARY: ${{ github.workspace }}/frozen/primo_linux_amd64
      PLAYWRIGHT_JSON_OUTPUT_FILE: framing-security-results.json
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: rc11-linux_amd64
          path: frozen
          run-id: 39188774819
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify the exact tested native artifact
        run: |
          chmod 755 "$PRIMO_TEST_CMS_BINARY"
          node tests/staging/rc8/verify.mjs
          node -e 'console.log("PRIMO_TEST_CMS_SHA256="+require("./frozen/platform-result.json").sha256)' >> "$GITHUB_ENV"
      - run: npx playwright install --with-deps chromium
      - name: Prove allowed rendering and cross-origin refusal in an isolated process
        run: npx playwright test --config tests/security/playwright.config.ts --reporter=list,json
      - name: Reverify all product bytes
        if: always()
        run: node tests/staging/rc8/verify.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: timing-framing-security
          path: |
            framing-security-results.json
            tests/security/test-results/
